<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraida's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#F3E3DD; --sidebar:#EAD1C8; --card:#FFFFFF; --border:#E4DACD;
    --text:#5C4A3A; --muted:#8B7D6E; --muted2:#A89685;
    --rose:#C9A0A8; --sage:#9CAF88; --gold:#C9A66B;
    --manifest-bg:#F6D9D2; --manifest-border:#E0B8AE; --manifest-text:#B5502F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Jost',sans-serif;color:var(--text);}
  .wrap{display:grid;grid-template-columns:220px 1fr;max-width:900px;margin:40px auto;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:0 6px 24px rgba(139,111,99,0.12);}
  .sidebar{background:var(--sidebar);padding:2rem 1.25rem;display:flex;flex-direction:column;gap:1.75rem;}
  .datetime .date{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .datetime .time{font-size:22px;color:var(--text);margin-top:4px;font-family:'Cormorant Garamond',serif;}
  .quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;line-height:2;color:var(--manifest-text);}
  .quote b{font-style:normal;font-weight:600;}
  .main{padding:2rem 2rem 2.5rem;}
  .greeting{font-family:'Cormorant Garamond',serif;font-size:30px;margin-bottom:1.5rem;transition:opacity .3s ease;min-height:40px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px;}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .label button{border:none;background:none;color:var(--muted2);cursor:pointer;font-size:14px;}
  .sched-item{font-size:13px;padding:4px 0 4px 8px;margin-bottom:6px;border-left:2px solid var(--rose);}
  .sched-item:nth-child(even){border-left-color:var(--sage);}
  .empty{font-size:12px;color:var(--muted2);font-style:italic;}
  .cal-embed{width:100% !important;height:258px !important;border:none;border-radius:8px;display:block;}
  .cal-note{font-size:11px;color:var(--muted2);text-align:center;}
  .links-card{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .link-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-decoration:none;cursor:pointer;}
  .link-item .dot{width:34px;height:34px;border-radius:50%;background:#F8EFE9;border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text);}
  .add-link{border:1px dashed var(--muted2);background:none;color:var(--muted2);}
  .braindump textarea{width:100%;border:none;background:transparent;resize:vertical;font-family:'Jost',sans-serif;font-size:13px;color:var(--text);min-height:26px;outline:none;}
  .manifest{background:var(--manifest-bg);border:0.5px solid var(--manifest-border);border-radius:12px;padding:18px;cursor:pointer;text-align:center;}
  .manifest h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--manifest-text);margin:0;font-weight:600;}
  .manifest-list{display:none;margin-top:12px;text-align:left;}
  .manifest-list.open{display:block;}
  .manifest-line{font-size:13px;color:var(--text);padding:4px 0;display:flex;justify-content:space-between;gap:8px;}
  .manifest-line span{cursor:default;}
  .manifest-line button{border:none;background:none;color:var(--manifest-text);opacity:0.5;cursor:pointer;font-size:12px;}
  .manifest-add{margin-top:8px;font-size:12px;color:var(--manifest-text);background:none;border:none;cursor:pointer;text-align:left;padding:0;}
  .flash-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:32px;font-style:italic;color:var(--manifest-text);z-index:999;transition:opacity .5s ease;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;width:230px;box-shadow:0 6px 20px rgba(0,0,0,0.12);z-index:900;}
  .toast .t-label{font-size:11px;color:var(--muted2);margin-bottom:4px;}
  .toast .t-name{font-size:14px;font-weight:500;margin-bottom:8px;}
  .toast .t-btns{display:flex;gap:8px;}
  .toast button{flex:1;font-size:11px;padding:6px;border-radius:8px;border:0.5px solid var(--border);background:#fff;cursor:pointer;font-family:'Jost',sans-serif;}
  .toast .snooze{background:var(--manifest-bg);border-color:var(--manifest-border);}
  .bday-manage{position:absolute;top:16px;right:16px;font-size:11px;color:var(--muted2);cursor:pointer;background:none;border:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(92,74,58,0.35);display:none;align-items:center;justify-content:center;z-index:1000;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--card);border-radius:14px;padding:22px;width:320px;max-height:80vh;overflow:auto;}
  .modal h4{margin:0 0 12px;font-family:'Cormorant Garamond',serif;font-size:20px;}
  .modal input{width:100%;padding:8px;margin-bottom:8px;border:0.5px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;}
  .modal .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:0.5px solid var(--border);}
  .modal .row button{border:none;background:none;color:var(--manifest-text);cursor:pointer;}
  .modal-actions{display:flex;gap:8px;margin-top:10px;}
  .modal-actions button{flex:1;padding:8px;border-radius:8px;border:0.5px solid var(--border);cursor:pointer;font-family:'Jost',sans-serif;}
  .close-x{float:right;cursor:pointer;color:var(--muted2);}
  .sched-edit-day{margin-bottom:10px;}
  .sched-edit-day label{font-size:11px;color:var(--muted2);text-transform:uppercase;}
  .sched-edit-day textarea{width:100%;font-family:'Jost',sans-serif;font-size:12px;border:0.5px solid var(--border);border-radius:8px;padding:6px;min-height:44px;}
</style>
</head>
<body>

<div class="flash-overlay" id="flashOverlay"></div>

<div class="wrap">
  <div class="sidebar">
    <div class="datetime">
      <div class="date" id="dateStr"></div>
      <div class="time" id="timeStr"></div>
    </div>
    <div class="quote" id="quoteBlock"></div>
  </div>

  <div class="main" style="position:relative">
    <button class="bday-manage" onclick="openBdayModal()">manage birthdays</button>
    <div class="greeting" id="greeting">Hello Fraida <span style="color:#D4A017">✦</span></div>

    <div class="grid2">
      <div class="card">
        <div class="label">Today's schedule <button onclick="openSchedModal()">edit</button></div>
        <div id="todaySched"></div>
        <button onclick="quickAddToday()" style="margin-top:8px;border:none;background:none;color:var(--muted2);font-size:11px;cursor:pointer;padding:0;">+ add just for today</button>
      </div>
      <div class="card" style="padding:14px;">
        <div class="label">Calendar</div>
        <div id="calConnectWrap">
          <button id="calConnectBtn" onclick="connectCalendar()" style="width:100%;padding:10px;border-radius:8px;border:0.5px solid var(--border);background:#F8EFE9;color:var(--text);cursor:pointer;font-family:'Jost',sans-serif;font-size:13px;">Connect Google Calendar</button>
        </div>
        <div id="calGrid" style="display:none;"></div>
      </div>
    </div>

    <div class="card links-card" id="linksCard" style="margin-bottom:14px;"></div>

    <div class="card braindump" style="margin-bottom:14px;">
      <div class="label">Brain dump</div>
      <textarea id="braindump" placeholder="tap to write..."></textarea>
    </div>

    <div class="manifest" id="manifestBox" onclick="toggleManifest(event)">
      <h3>you're her, act like it</h3>
      <div class="manifest-list" id="manifestList"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="bdayModalBg">
  <div class="modal">
    <span class="close-x" onclick="closeModal('bdayModalBg')">✕</span>
    <h4>Birthdays</h4>
    <div id="bdayList"></div>
    <input id="bdayName" placeholder="Name">
    <div style="display:flex;gap:12px;margin-bottom:8px;font-size:12px;">
      <label><input type="radio" name="calType" value="gregorian" checked onchange="toggleCalType()"> Gregorian</label>
      <label><input type="radio" name="calType" value="hebrew" onchange="toggleCalType()"> Hebrew</label>
    </div>
    <div id="gregorianInput">
      <input id="bdayDate" type="date" placeholder="Date">
    </div>
    <div id="hebrewInput" style="display:none;">
      <select id="bdayHebMonth" style="width:100%;padding:8px;margin-bottom:8px;border:0.5px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;">
        <option value="Nisan">Nisan</option>
        <option value="Iyyar">Iyyar</option>
        <option value="Sivan">Sivan</option>
        <option value="Tamuz">Tamuz</option>
        <option value="Av">Av</option>
        <option value="Elul">Elul</option>
        <option value="Tishrei">Tishrei</option>
        <option value="Cheshvan">Cheshvan</option>
        <option value="Kislev">Kislev</option>
        <option value="Tevet">Tevet</option>
        <option value="Sh'vat">Sh'vat</option>
        <option value="Adar">Adar</option>
        <option value="Adar I">Adar I (leap years)</option>
        <option value="Adar II">Adar II (leap years)</option>
      </select>
      <select id="bdayHebDay" style="width:100%;padding:8px;margin-bottom:8px;border:0.5px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;"></select>
      <div style="font-size:11px;color:var(--muted2);margin-bottom:8px;">The Gregorian date is recalculated automatically each year.</div>
    </div>
    <div class="modal-actions"><button onclick="addBday()">Add</button></div>
  </div>
</div>

<div class="modal-bg" id="schedModalBg">
  <div class="modal">
    <span class="close-x" onclick="closeModal('schedModalBg')">✕</span>
    <h4>Weekly schedule</h4>
    <div id="schedEditor"></div>
    <div class="modal-actions"><button onclick="saveSchedule()">Save</button></div>
  </div>
</div>

<div class="modal-bg" id="dayModalBg">
  <div class="modal" style="width:260px;">
    <span class="close-x" onclick="closeModal('dayModalBg')">✕</span>
    <h4 id="dayModalTitle"></h4>
    <div id="dayModalContent" style="font-size:13px;line-height:1.8;"></div>
  </div>
</div>

<div id="toastArea"></div>

<script>
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const QUOTE_LINES=["I get to move my body.","I get to make better choices.","I get to keep trying.","I get to plan and prepare.","I get to show up for myself.","I get to build a life I love.","I get to say thank you.","I get to be myself."];
const FLASH_MESSAGES=["Hey love","You got this, babe","Hello, gorgeous"];
const DEFAULT_LINKS=[
  {name:"Canvas",url:"https://login.uc.edu/idp/profile/SAML2/Redirect/SSO?execution=e1s2"},
  {name:"Gmail",url:"https://mail.google.com/mail/u/0/#inbox"},
  {name:"UC Email",url:"https://outlook.cloud.microsoft/mail/"},
  {name:"Drive",url:"https://drive.google.com/drive/u/0/home"}
];
const DEFAULT_MANIFEST=["I am confident and calm.","I show up for myself daily.","I trust my own timing."];

function ls_get(key,fallback){
  try{const v=localStorage.getItem(key); return v?JSON.parse(v):fallback;}catch(e){return fallback;}
}
function ls_set(key,val){localStorage.setItem(key,JSON.stringify(val));}

// ---- date/time + quote ----
function renderDateTime(){
  const now=new Date();
  document.getElementById('dateStr').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  document.getElementById('timeStr').textContent=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
renderDateTime();
setInterval(renderDateTime,30000);

document.getElementById('quoteBlock').innerHTML=QUOTE_LINES.map(l=>l.replace('get','<b>get</b>')).map(l=>`<div>${l}</div>`).join('');

// ---- flash greeting ----
(function(){
  const overlay=document.getElementById('flashOverlay');
  const msg=FLASH_MESSAGES[Math.floor(Math.random()*FLASH_MESSAGES.length)];
  overlay.textContent=msg;
  setTimeout(()=>{overlay.style.opacity=0;setTimeout(()=>overlay.style.display='none',500);},1200);
})();

// ---- today's schedule ----
function getWeeklySchedule(){
  return ls_get('moodDash_weeklySchedule',{Sun:[],Mon:[],Tue:[],Wed:[],Thu:[],Fri:[],Sat:[]});
}
function renderTodaySchedule(){
  const sched=getWeeklySchedule();
  const today=DAYS[new Date().getDay()];
  const recurring=(sched[today]||[]);
  const todayKey=new Date().toISOString().slice(0,10);
  const overrides=ls_get('moodDash_dateOverrides',{});
  const oneOff=overrides[todayKey]||[];
  const items=recurring.concat(oneOff).slice().sort((a,b)=>a.time.localeCompare(b.time));
  const el=document.getElementById('todaySched');
  if(items.length===0){el.innerHTML='<div class="empty">Nothing scheduled — enjoy it.</div>';return;}
  el.innerHTML=items.map(i=>`<div class="sched-item">${i.time} · ${i.title}${i.oneOff?' <span style="color:var(--muted2);font-size:11px;">(today only)</span>':''}${i.link?` · <a href="${i.link}" target="_blank" style="color:var(--rose);">link</a>`:''}</div>`).join('');
}
renderTodaySchedule();

function quickAddToday(){
  const time=prompt('Time (e.g. 9:00 or 2:30 PM):'); if(!time)return;
  const title=prompt('What is it?'); if(!title)return;
  const todayKey=new Date().toISOString().slice(0,10);
  const overrides=ls_get('moodDash_dateOverrides',{});
  if(!overrides[todayKey])overrides[todayKey]=[];
  overrides[todayKey].push({time,title,oneOff:true});
  ls_set('moodDash_dateOverrides',overrides);
  renderTodaySchedule();
}

// ---- Google Calendar connection ----
const GCAL_CLIENT_ID='873030677337-9crhcpku2ckesuc43i0q1vfp9fdhc631.apps.googleusercontent.com';
let gcalToken=null;
let gcalTokenClient=null;

function initGcal(retries){
  retries = retries || 0;
  if(!window.google || !window.google.accounts){
    if(retries<15){ setTimeout(()=>initGcal(retries+1),400); return; }
    document.getElementById('calConnectWrap').innerHTML='<div class="empty">Calendar connection needs this page to be deployed online (not opened as a local file). Once deployed, this button will work.</div>';
    return;
  }
  gcalTokenClient=google.accounts.oauth2.initTokenClient({
    client_id: GCAL_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks.readonly',
    callback: (resp)=>{
      if(resp && resp.access_token){
        gcalToken=resp.access_token;
        localStorage.setItem('moodDash_gcalToken',resp.access_token);
        localStorage.setItem('moodDash_gcalExpiry', Date.now()+ (resp.expires_in*1000));
        localStorage.setItem('moodDash_scopeVersion','2');
        localStorage.setItem('moodDash_hasConsented','2');
        onCalendarConnected();
      }
    }
  });
  const SCOPE_VERSION='2';
  const savedToken=localStorage.getItem('moodDash_gcalToken');
  const savedExpiry=localStorage.getItem('moodDash_gcalExpiry');
  const savedScopeVersion=localStorage.getItem('moodDash_scopeVersion');
  const hasConsented=localStorage.getItem('moodDash_hasConsented')===SCOPE_VERSION;

  if(savedToken && savedExpiry && Date.now()<Number(savedExpiry) && savedScopeVersion===SCOPE_VERSION){
    gcalToken=savedToken;
    onCalendarConnected();
  }else if(hasConsented){
    // Previously granted access — try to reconnect silently, no button click needed.
    document.getElementById('calConnectWrap').innerHTML='<div class="empty">Reconnecting to your calendar...</div>';
    let settled=false;
    gcalTokenClient.callback=(resp)=>{
      settled=true;
      if(resp && resp.access_token){
        gcalToken=resp.access_token;
        localStorage.setItem('moodDash_gcalToken',resp.access_token);
        localStorage.setItem('moodDash_gcalExpiry', Date.now()+ (resp.expires_in*1000));
        localStorage.setItem('moodDash_scopeVersion','2');
        onCalendarConnected();
      }else{
        showConnectButton();
      }
    };
    gcalTokenClient.requestAccessToken({prompt:''});
    setTimeout(()=>{ if(!settled) showConnectButton(); },3000);
  }
}
function showConnectButton(){
  document.getElementById('calConnectWrap').innerHTML='<button id="calConnectBtn" onclick="connectCalendar()" style="width:100%;padding:10px;border-radius:8px;border:0.5px solid var(--border);background:#F8EFE9;color:var(--text);cursor:pointer;font-family:\'Jost\',sans-serif;font-size:13px;">Connect Google Calendar</button>';
}
function connectCalendar(){
  if(gcalTokenClient) gcalTokenClient.requestAccessToken({prompt:'consent'});
}
function onCalendarConnected(){
  document.getElementById('calConnectWrap').style.display='none';
  document.getElementById('calGrid').style.display='block';
  fetchCalendarEvents();
}
function fetchTasksNormalized(){
  return fetch('https://www.googleapis.com/tasks/v1/users/@me/lists',{headers:{Authorization:'Bearer '+gcalToken}})
    .then(r=>r.json())
    .then(listData=>{
      const lists=(listData.items||[]).map(l=>l.id);
      const requests=lists.map(listId=>
        fetch(`https://www.googleapis.com/tasks/v1/lists/${encodeURIComponent(listId)}/tasks?showCompleted=false`,{headers:{Authorization:'Bearer '+gcalToken}})
          .then(r=>r.json()).catch(()=>({items:[]}))
      );
      return Promise.all(requests).then(results=>{
        let tasks=[];
        results.forEach(data=>{ if(data && data.items) tasks=tasks.concat(data.items); });
        return tasks.filter(t=>t.due).map(t=>({
          summary:t.title||'(untitled task)',
          description:t.notes||'',
          location:'',
          isTask:true,
          start:{date:t.due.slice(0,10)}
        }));
      });
    }).catch(()=>[]);
}
function fetchCalendarEvents(){
  fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList',{headers:{Authorization:'Bearer '+gcalToken}})
    .then(r=>r.json())
    .then(listData=>{
      if(listData.error){
        document.getElementById('calGrid').innerHTML=`<div class="empty">Calendar error: ${listData.error.message||'unknown'}. Try clicking Connect again.</div>`;
        return;
      }
      const calendars=(listData.items||[]).map(c=>c.id);
      const now=new Date();
      const monthStart=new Date(now.getFullYear(),now.getMonth(),1,0,0,0);
      const monthEnd=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59);
      const requests=calendars.map(calId=>{
        const url=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?timeMin=${monthStart.toISOString()}&timeMax=${monthEnd.toISOString()}&singleEvents=true&orderBy=startTime`;
        return fetch(url,{headers:{Authorization:'Bearer '+gcalToken}}).then(r=>r.json()).catch(()=>({items:[]}));
      });
      Promise.all([Promise.all(requests), fetchTasksNormalized()]).then(([results, taskItems])=>{
        let allItems=[];
        results.forEach(data=>{
          if(data && data.items) allItems=allItems.concat(data.items);
        });
        allItems=allItems.filter(ev=>ev.start && (ev.start.dateTime||ev.start.date));
        const timedItems=allItems.filter(ev=>ev.start.dateTime);
        renderMonthGrid(allItems.concat(taskItems));
        mergeTodayCalendarEvents(timedItems);
      });
    })
    .catch((err)=>{
      document.getElementById('calGrid').innerHTML=`<div class="empty">Could not reach calendar: ${err}</div>`;
    });
}
function extractLink(ev){
  if(ev.conferenceData && ev.conferenceData.entryPoints){
    const videoEntry=ev.conferenceData.entryPoints.find(e=>e.entryPointType==='video');
    if(videoEntry && videoEntry.uri) return videoEntry.uri;
  }
  if(ev.hangoutLink) return ev.hangoutLink;
  const urlRegex=/(https?:\/\/[^\s"<]+)/i;
  if(ev.location){ const m=ev.location.match(urlRegex); if(m) return m[0]; }
  if(ev.description){ const plain=ev.description.replace(/<[^>]*>/g,' '); const m=plain.match(urlRegex); if(m) return m[0]; }
  return null;
}
function renderMonthGrid(items){
  const now=new Date();
  const year=now.getFullYear(), month=now.getMonth();
  const firstDay=new Date(year,month,1);
  const daysInMonth=new Date(year,month+1,0).getDate();
  const startOffset=firstDay.getDay();
  const eventsByDate={};
  items.forEach(ev=>{
    const isAllDay=!ev.start.dateTime;
    const key=isAllDay ? new Date(ev.start.date+'T00:00:00').toDateString() : new Date(ev.start.dateTime).toDateString();
    if(!eventsByDate[key]) eventsByDate[key]=[];
    const timeLabel=ev.isTask?'Task':(isAllDay?'All day':new Date(ev.start.dateTime).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));
    eventsByDate[key].push({
      time:timeLabel,
      title:ev.summary||'(no title)',
      location:ev.location||'',
      link:extractLink(ev)
    });
  });
  window._monthGridEvents=eventsByDate;
  const monthLabel=firstDay.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let cells='';
  for(let i=0;i<startOffset;i++) cells+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const cellDate=new Date(year,month,d);
    const isToday=cellDate.toDateString()===now.toDateString();
    const dateKey=cellDate.toDateString();
    const hasEvent=!!eventsByDate[dateKey];
    let bg='transparent';
    if(isToday) bg='var(--manifest-bg)';
    else if(hasEvent) bg='#EAF0E4';
    const clickAttr=hasEvent?`onclick="openDayPopup('${dateKey}')"`:'';
    cells+=`<div ${clickAttr} style="position:relative;padding:5px 0;border-radius:6px;background:${bg};${isToday?'font-weight:600;':''}${hasEvent?'cursor:pointer;':''}">${d}${hasEvent?'<div style="width:5px;height:5px;border-radius:50%;background:var(--rose);margin:2px auto 0;"></div>':''}</div>`;
  }
  const el=document.getElementById('calGrid');
  el.innerHTML=`<div style="font-size:12px;color:var(--muted2);text-align:center;margin-bottom:8px;">${monthLabel}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;color:var(--muted2);text-align:center;margin-bottom:4px;">
      <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center;color:var(--text);">${cells}</div>
    <div style="font-size:10px;color:var(--muted2);text-align:center;margin-top:8px;">click a highlighted day to see what's on it</div>`;
}

function mergeTodayCalendarEvents(items){
  const todayStr=new Date().toDateString();
  const todays=items.filter(ev=>new Date(ev.start.dateTime).toDateString()===todayStr);
  const todayKey=new Date().toISOString().slice(0,10);
  const overrides=ls_get('moodDash_dateOverrides',{});
  overrides[todayKey]=(overrides[todayKey]||[]).filter(i=>!i.fromCalendar);
  todays.forEach(ev=>{
    const start=new Date(ev.start.dateTime);
    const timeLabel=start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    const link=extractLink(ev);
    overrides[todayKey].push({time:timeLabel,title:ev.summary||'(no title)',oneOff:true,fromCalendar:true,link});
  });
  ls_set('moodDash_dateOverrides',overrides);
  renderTodaySchedule();
}

function saveSchedule(){

      return{time:l.slice(0,idx).trim(),title:l.slice(idx+3).trim()};

  closeModal('schedModalBg');

// ---- birthdays ----
function getBdays(){return ls_get('moodDash_birthdays',[]);}
function saveBdays(list){ls_set('moodDash_birthdays',list);}

function daysUntil(month,day){
  const now=new Date(); const year=now.getFullYear();
  let target=new Date(year,month-1,day);
  target.setHours(0,0,0,0); now.setHours(0,0,0,0);
  if(target<now) target=new Date(year+1,month-1,day);
  return Math.round((target-now)/86400000);
}

// ---- Hebrew date resolution ----
let _todayHebrewYearCache=null;
function getTodayHebrewYear(){
  if(_todayHebrewYearCache) return Promise.resolve(_todayHebrewYearCache);
  const now=new Date();
  const dateStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  return fetch(`https://www.hebcal.com/converter?cfg=json&date=${dateStr}&g2h=1`)
    .then(r=>r.json())
    .then(data=>{ _todayHebrewYearCache=data.hy; return data.hy; })
    .catch(()=>null);
}
function hebrewToGregorianDate(hy,hmonth,hday){
  const url=`https://www.hebcal.com/converter?cfg=json&hy=${hy}&hm=${encodeURIComponent(hmonth)}&hd=${hday}&h2g=1`;
  return fetch(url).then(r=>r.json()).then(data=>{
    if(data.error||!data.gy) return null;
    return new Date(data.gy, data.gm-1, data.gd);
  }).catch(()=>null);
}
function resolveHebrewBirthday(hmonth,hday){
  return getTodayHebrewYear().then(hy=>{
    if(!hy) return null;
    const now=new Date(); now.setHours(0,0,0,0);
    return hebrewToGregorianDate(hy,hmonth,hday).then(d=>{
      if(!d) return null;
      if(d<now) return hebrewToGregorianDate(hy+1,hmonth,hday);
      return d;
    });
  });
}
function resolveBdayGregorian(b){
  if(b.calType==='hebrew') return resolveHebrewBirthday(b.hebrewMonth,b.hebrewDay);
  const now=new Date(); const year=now.getFullYear();  let target=new Date(year,b.month-1,b.day); target.setHours(0,0,0,0);
  const today=new Date(); today.setHours(0,0,0,0);
  if(target<today) target=new Date(year+1,b.month-1,b.day);
  return Promise.resolve(target);
}

function checkBirthdayPopup(){
  const list=getBdays();
  const dismissed=ls_get('moodDash_bdayDismissed',{});
  const snoozed=ls_get('moodDash_bdaySnoozed',{});
  const todayStr=new Date().toDateString();
  const now=new Date(); now.setHours(0,0,0,0);
  Promise.all(list.map(b=>resolveBdayGregorian(b).then(d=>({b,d})))).then(resolved=>{
    let candidate=null, minDays=999, candidateDate=null;
    resolved.forEach(({b,d})=>{
      if(!d) return;
      const days=Math.round((d-now)/86400000);
      if(days<=7){
        const year=new Date().getFullYear();
        if(dismissed[b.id]===year) return;
        if(snoozed[b.id] && snoozed[b.id]===todayStr) return;
        if(days<minDays){minDays=days;candidate=b;candidateDate=d;}
      }
    });
    if(candidate) showBdayToast(candidate,minDays,candidateDate);
  });
}

function showBdayToast(b,days,dateObj){
  const area=document.getElementById('toastArea');
  const dateStr=dateObj.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const whenText = days===0?'today!':days===1?'tomorrow':`in ${days} days`;
  area.innerHTML=`<div class="toast">
    <div class="t-label">Upcoming birthday</div>
    <div class="t-name">${b.name} · ${dateStr} · ${whenText}</div>
    <div class="t-btns">
      <button onclick="dismissBday('${b.id}')">Dismiss</button>
      <button class="snooze" onclick="snoozeBday('${b.id}')">Remind later</button>
    </div>
  </div>`;
}
function dismissBday(id){
  const dismissed=ls_get('moodDash_bdayDismissed',{});
  dismissed[id]=new Date().getFullYear();
  ls_set('moodDash_bdayDismissed',dismissed);
  document.getElementById('toastArea').innerHTML='';
}
function snoozeBday(id){
  const snoozed=ls_get('moodDash_bdaySnoozed',{});
  snoozed[id]=new Date().toDateString();
  ls_set('moodDash_bdaySnoozed',snoozed);
  document.getElementById('toastArea').innerHTML='';
}
checkBirthdayPopup();

  const isHebrew=document.querySelector('input[name="calType"]:checked').value==='hebrew';
  document.getElementById('gregorianInput').style.display=isHebrew?'none':'block';
  document.getElementById('hebrewInput').style.display=isHebrew?'block':'none';
  if(isHebrew) populateHebDayOptions();
}
function populateHebDayOptions(){
  const sel=document.getElementById('bdayHebDay');
  sel.innerHTML='';
  for(let d=1;d<=30;d++){
    sel.innerHTML+=`<option value="${d}">${d}</option>`;
  }
}
function openBdayModal(){
  renderBdayList();
  populateHebDayOptions();
  document.getElementById('bdayModalBg').classList.add('open');
}
function renderBdayList(){
  const list=getBdays();
  const el=document.getElementById('bdayList');
  if(list.length===0){el.innerHTML='<div class="empty">No birthdays added yet.</div>';return;}
  el.innerHTML=list.map(b=>`<div class="row" id="bday-row-${b.id}"><span>${b.name} — loading...</span><button onclick="deleteBday('${b.id}')">delete</button></div>`).join('');
  list.forEach(b=>{
    resolveBdayGregorian(b).then(d=>{
      const row=document.getElementById(`bday-row-${b.id}`);
      if(!row) return;
      const dateStr=d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'date unavailable';
      const tag=b.calType==='hebrew'?' (Hebrew)':'';
      row.querySelector('span').textContent=`${b.name} — ${dateStr}${tag}`;
    });
  });
}
function addBday(){
  const name=document.getElementById('bdayName').value.trim();
  if(!name){alert('Add a name.');return;}
  const isHebrew=document.querySelector('input[name="calType"]:checked').value==='hebrew';
  const list=getBdays();
  if(isHebrew){
    const hebrewMonth=document.getElementById('bdayHebMonth').value;
    const hebrewDay=Number(document.getElementById('bdayHebDay').value);
    list.push({id:Date.now().toString(),name,calType:'hebrew',hebrewMonth,hebrewDay});
  }else{
    const dateVal=document.getElementById('bdayDate').value;
    if(!dateVal){alert('Add a date.');return;}
    const [y,m,d]=dateVal.split('-').map(Number);
    list.push({id:Date.now().toString(),name,calType:'gregorian',month:m,day:d});
  }
  saveBdays(list);
  document.getElementById('bdayName').value='';
  document.getElementById('bdayDate').value='';
  renderBdayList();
}
function deleteBday(id){
  let list=getBdays();
  list=list.filter(b=>b.id!==id);
  saveBdays(list);
  renderBdayList();
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
